# Application
spring.application.name=relayhook

spring.datasource.url=jdbc:postgresql://postgres:5432/relayhooks
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=${PORT:8080}
spring.devtools.restart.enabled=true

# (Optional) JPA settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update  
spring.jpa.show-sql=true 


spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=relayuser
spring.rabbitmq.password=relaypass
spring.rabbitmq.template.default-receive-queue=workflow.node.execute

spring.relayhook.baseurl=http://172.25.192.1:5000