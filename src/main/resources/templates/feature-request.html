<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>New Feature Request</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; background-color:#f5f7fb; padding:20px;">

<div style="max-width:600px; margin:auto; background:white; border-radius:12px; padding:24px;">

    <h2 style="margin-top:0;">New Feature Request</h2>

    <p>A user submitted a new feature request. Details below:</p>

    <div style="background:#f2f2ff; border-radius:8px; padding:16px;">

        <p><strong>User Name:</strong> <span th:text="${userName}"></span></p>
        <p><strong>User Email:</strong> <span th:text="${userEmail}"></span></p>
        <p><strong>Feature Title:</strong> <span th:text="${featureTitle}"></span></p>

        <p><strong>Description:</strong></p>
        <p th:text="${featureDescription}"></p>

    </div>

    <p style="margin-top:20px;">
        Automatically generated by the system.
    </p>

</div>

</body>
</html>
