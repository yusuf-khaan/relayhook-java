<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f7f7f7; padding: 20px;">
    <div style="max-width: 600px; margin: auto; background-color: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        <h2 style="color: #4f46e5;">Password Reset Successful</h2>
        <p>Hi <strong th:text="${name}">User</strong>,</p>
        <p>Your password has been successfully reset. Here is your **new password**:</p>
        <p style="font-size: 18px; font-weight: bold; color: #111;"> 
            <span th:text="${newPassword}">NEW_PASSWORD</span>
        </p>
        <p>If you have not requested a new password, please contact us at support@relayhook.in</p>
        <a href="https://relayhook.in" style="display: inline-block; padding: 10px 20px; background-color: #4f46e5; color: white; text-decoration: none; border-radius: 5px;">
            Login Now
        </a>
        <p style="margin-top: 20px; color: #888;">Team SurgeIT</p>
    </div>
</body>
</html>
